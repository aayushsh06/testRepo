<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR Meta Quest</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
        }
        #container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        #enterVR {
            padding: 20px 40px;
            font-size: 20px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
        #enterVR:hover {
            background: #0052a3;
        }
        #enterVR:disabled {
            background: #666;
            cursor: not-allowed;
        }
        #info {
            margin-bottom: 20px;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="info">
            <h1>WebXR Meta Quest Experience</h1>
            <p>A simple VR experience with interactive 3D objects</p>
            <p id="status">Checking VR support...</p>
        </div>
        <button id="enterVR" disabled>Enter VR</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, controller1, controller2;
        let objects = [];
        const status = document.getElementById('status');
        const btn = document.getElementById('enterVR');

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.6, 3);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;

            // Lighting
            const ambient = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambient);

            const directional = new THREE.DirectionalLight(0xffffff, 0.8);
            directional.position.set(5, 10, 5);
            scene.add(directional);

            // Floor
            const floorGeo = new THREE.PlaneGeometry(20, 20);
            const floorMat = new THREE.MeshStandardMaterial({ 
                color: 0x16213e,
                roughness: 0.8
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Create interactive objects
            createObjects();

            // Controllers
            controller1 = renderer.xr.getController(0);
            controller1.addEventListener('selectstart', onSelectStart);
            controller1.addEventListener('selectend', onSelectEnd);
            scene.add(controller1);

            controller2 = renderer.xr.getController(1);
            controller2.addEventListener('selectstart', onSelectStart);
            controller2.addEventListener('selectend', onSelectEnd);
            scene.add(controller2);

            // Controller rays
            const geometry = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0, 0, -1)
            ]);
            const material = new THREE.LineBasicMaterial({ color: 0x00ff00 });

            const line1 = new THREE.Line(geometry, material);
            line1.scale.z = 5;
            controller1.add(line1);

            const line2 = new THREE.Line(geometry, material);
            line2.scale.z = 5;
            controller2.add(line2);

            window.addEventListener('resize', onWindowResize);
        }

        function createObjects() {
            const colors = [0xff6b6b, 0x4ecdc4, 0xffe66d, 0xa8e6cf, 0xff8b94];
            const geometries = [
                new THREE.BoxGeometry(0.3, 0.3, 0.3),
                new THREE.SphereGeometry(0.2, 16, 16),
                new THREE.ConeGeometry(0.2, 0.4, 16),
                new THREE.TorusGeometry(0.15, 0.05, 16, 32)
            ];

            for (let i = 0; i < 8; i++) {
                const geo = geometries[i % geometries.length];
                const mat = new THREE.MeshStandardMaterial({ 
                    color: colors[i % colors.length],
                    roughness: 0.5,
                    metalness: 0.3
                });
                const mesh = new THREE.Mesh(geo, mat);
                
                const angle = (i / 8) * Math.PI * 2;
                const radius = 2;
                mesh.position.set(
                    Math.cos(angle) * radius,
                    1.5 + Math.sin(i) * 0.5,
                    Math.sin(angle) * radius - 2
                );
                
                mesh.userData.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.002,
                    (Math.random() - 0.5) * 0.002,
                    (Math.random() - 0.5) * 0.002
                );
                
                scene.add(mesh);
                objects.push(mesh);
            }
        }

        let selectedObject = null;

        function onSelectStart(e) {
            const controller = e.target;
            const intersections = getIntersections(controller);

            if (intersections.length > 0) {
                const obj = intersections[0].object;
                selectedObject = obj;
                selectedObject.material.emissive.setHex(0x666666);
                controller.attach(selectedObject);
            }
        }

        function onSelectEnd(e) {
            if (selectedObject) {
                selectedObject.material.emissive.setHex(0x000000);
                scene.attach(selectedObject);
                selectedObject = null;
            }
        }

        function getIntersections(controller) {
            const tempMatrix = new THREE.Matrix4();
            tempMatrix.identity().extractRotation(controller.matrixWorld);

            const raycaster = new THREE.Raycaster();
            raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
            raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

            return raycaster.intersectObjects(objects);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render() {
            // Animate objects
            objects.forEach(obj => {
                obj.rotation.x += 0.01;
                obj.rotation.y += 0.01;
                
                if (!selectedObject || selectedObject !== obj) {
                    obj.position.add(obj.userData.velocity);
                    
                    if (Math.abs(obj.position.x) > 3) obj.userData.velocity.x *= -1;
                    if (obj.position.y > 3 || obj.position.y < 0.5) obj.userData.velocity.y *= -1;
                    if (Math.abs(obj.position.z + 2) > 3) obj.userData.velocity.z *= -1;
                }
            });

            renderer.render(scene, camera);
        }

        // Check WebXR support
        if (navigator.xr) {
            navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
                if (supported) {
                    status.textContent = 'VR Ready! Click the button below to enter.';
                    btn.disabled = false;
                    btn.onclick = () => {
                        btn.disabled = true;
                        renderer.xr.getSession().then(() => {
                            document.body.appendChild(renderer.domElement);
                        });
                    };
                } else {
                    status.textContent = 'VR not supported on this device.';
                }
            });
        } else {
            status.textContent = 'WebXR not available in this browser.';
        }

        // Initialize and start
        init();
        animate();

        // Setup VR button
        btn.addEventListener('click', async () => {
            const sessionInit = {
                optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking']
            };
            
            try {
                const session = await navigator.xr.requestSession('immersive-vr', sessionInit);
                await renderer.xr.setSession(session);
                document.getElementById('container').style.display = 'none';
                document.body.appendChild(renderer.domElement);
            } catch (e) {
                console.error('Failed to start VR session:', e);
                status.textContent = 'Failed to start VR session: ' + e.message;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
